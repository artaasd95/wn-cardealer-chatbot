[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wn-cardealer-chatbot"
version = "0.1.0"
description = "Car dealer chatbot: identify a car, retrieve the matching dealer, then show dealer details or schedule a call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arta Asadi", email = "artaasd95@gmail.com" }]
# Floor is 3.12; the scaffold .venv is 3.13.9.
requires-python = ">=3.12"
keywords = ["chatbot", "car-dealer", "fastapi", "clean-architecture", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# [project.urls] -- add once the remote is published
# Repository = "..."

dependencies = [
    # web layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # UI layer
    "streamlit>=1.40",
    # contracts + config (.env loading for config/settings.py)
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # LLM adapter: speaks the OpenAI wire protocol, which is exactly what
    # OpenAICompatibleClient needs to reach every /v1-compatible endpoint.
    "openai>=1.54",
    # persistence (SQLite default so the assignment runs with no external service)
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Installed with: pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

# src layout: the wheel ships the packages at top level, so imports read
# `DTO.inputs.chat`, `application.chat.service`, `infrastructure.llm.factory`
# and never as a bare top-level module.
[tool.hatch.build.targets.wheel]
packages = [
    "src/DTO",
    "src/application",
    "src/config",
    "src/domain",
    "src/infrastructure",
    "src/models",
    "src/ports",
    "src/presentation",
]

# `scripts` is a plain script directory and is deliberately NOT shipped.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "data", "scripts", "pyproject.toml", ".env.example"]
exclude = ["**/__pycache__", "**/*.pyc"]

# --- tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# lets tests import `src/` without requiring an editable install first
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast isolated tests, no external dependencies",
    "integration: tests that touch the database or the HTTP layer",
]
filterwarnings = [
    "error",  # a warning that matters should fail the suite, not scroll past
    # third-party deprecations we do not control
    "ignore::DeprecationWarning:streamlit.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

# Coverage is configured but not forced into `addopts`, so a bare `pytest`
# stays fast. Run explicitly with: pytest --cov=src --cov-report=term-missing
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__init__.py",
    "src/presentation/streamlit/*",  # UI glue, exercised by hand not by tests
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70  # raise as the suite matures
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --- lint / format -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "TID", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# package markers may re-export names for convenience
"**/__init__.py" = ["F401"]
# the DTO package name is uppercase by design; the naming lint must not fight it
"src/DTO/**/*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = [
    "DTO",
    "application",
    "config",
    "domain",
    "infrastructure",
    "models",
    "ports",
    "presentation",
]

# imports must be absolute within the package tree, so the layering stays legible
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# --- types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src"]
# src layout: resolve `domain`, `DTO`, `ports`, ... as first-party sources
# instead of as installed-but-untyped distributions.
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true
# third-party stubs are not shipped for the LLM SDK
[[tool.mypy.overrides]]
module = ["openai.*", "streamlit.*"]
ignore_missing_imports = true
